<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F0E6">
<meta name="color-scheme" content="light dark">
<title>חובותיי</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="screen" tabindex="-1"></main>
</div>
<nav id="tabs" aria-label="ניווט ראשי">
  <div class="inner">
    <button type="button" data-action="tab" data-tab="home" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      <span>היום</span>
    </button>
    <button type="button" data-action="tab" data-tab="library">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
      <span>ספרייה</span>
    </button>
    <button type="button" data-action="tab" data-tab="progress">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      <span>התקדמות</span>
    </button>
    <button type="button" data-action="tab" data-tab="settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M2 14h4"/><path d="M10 8h4"/><path d="M18 16h4"/></svg>
      <span>הגדרות</span>
    </button>
  </div>
</nav>
<div id="page-root"></div>
<div id="sheet-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>
<input type="file" id="file-pdf" accept="application/pdf,.pdf" hidden>
<input type="file" id="file-audio" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac,.wma,.amr,.3gp" multiple hidden>
<input type="file" id="file-backup" accept="application/json,.json,text/plain" hidden>
<script src="cap-runtime.js"></script>
<script src="app.js"></script>
</body>
</html>
